# PLC ↔ edge bridge register map (Modbus TCP). Rules: docs/prd/contracts.md §2.
#
# The PLC (OpenPLC) is the Modbus server; the edge bridge is its only client.
#   %MWn  = holding register 1024 + n (16-bit)
#   %MDn  = holding registers 2048 + 2n, 2049 + 2n (32-bit, high word first)
# Status words are signed 16-bit scaled integers (engineering value × scale). Metric names are
# the Sparkplug metric names (contracts.md §3). deadband: report-by-exception threshold in
# engineering units.
#
# PLC side (plc/scripts/codegen): a metric is read from the sim I/O signal of the same name
# (`{name}` or `{device}_{name}` in sim-io.yaml), else from `source:`, else from the device's
# status struct G_Status.{device}.{name}.
version: 1

addressing:
  mw_holding_base: 1024
  md_holding_base: 2048

enums:
  PackMLState:   # PackML v3 state numbers (ISA-TR88.00.02)
    {0: Undefined, 1: Clearing, 2: Stopped, 3: Starting, 4: Idle, 5: Suspended, 6: Execute,
     7: Stopping, 8: Aborting, 9: Aborted, 10: Holding, 11: Held, 12: Unholding, 13: Suspending,
     14: Unsuspending, 15: Resetting, 16: Completing, 17: Complete}
  PackMLMode: {1: Production, 2: Maintenance, 3: Manual}
  BatchPhase: {0: Idle, 1: Fill, 2: Mix, 3: Transfer, 4: Drain, 5: CIP}
  Command: {0: None, 1: Start, 2: Stop, 3: Reset, 4: Abort, 5: Clear}
  RecipeNak:
    {1: InExecute, 2: BrixOutOfRange, 3: ConcRatioOutOfRange, 4: FillWeightOutOfRange,
     5: LineSpeedOutOfRange, 6: CapTorqueOutOfRange, 7: UnknownProduct, 8: Busy}

# --- %MW0–%MW799: status, PLC → bridge (one 50-word block per device) --------------------------
# Packaging header (offsets 0–9) is the same for F401, C501, L601, Q701, K801.
packaging_header:
  - {name: State,          offset: 0, enum: PackMLState}
  - {name: Mode,           offset: 1, enum: PackMLMode}
  - {name: StopReason,     offset: 2, description: "1–99 = automatic (alarm id), ≥ 100 = operator reason code"}
  - {name: AlarmWord,      offset: 3, source: "G_Alarms.{device}_Word", description: "bit n = local alarm n active"}
  - {name: CommsOk,        offset: 4, type: bool, source: "G_Comms.{device}"}
  - {name: Blocked,        offset: 5, type: bool}
  - {name: Starved,        offset: 6, type: bool}
  - {name: Running,        offset: 7, type: bool, description: Run feedback from the machine}
  - {name: Speed,          offset: 8, unit: bpm, deadband: 1}
  - {name: SpeedSP,        offset: 9, unit: bpm}

status:
  T101:
    base: 0
    metrics:
      - {name: Phase,             offset: 0, enum: BatchPhase}
      - {name: AlarmWord,         offset: 3, source: "G_Alarms.{device}_Word"}
      - {name: CommsOk,           offset: 4, type: bool, source: "G_Comms.{device}"}
      - {name: LT101_Level,       offset: 10, scale: 10,  unit: "%", deadband: 0.5}
      - {name: AT101_Brix,        offset: 11, scale: 100, unit: "°Bx", deadband: 0.05}
      - {name: BatchNo,           offset: 12, description: Increments at each fill start}
      - {name: ProductCode,       offset: 13, description: "Product in the tank (1 orange, 2 apple)"}
      - {name: BatchBrix,         offset: 14, scale: 100, unit: "°Bx", description: Latched at end of mix}
      - {name: BrixOk,            offset: 15, type: bool, description: BatchBrix within recipe tolerance}
      - {name: BatchActive,       offset: 16, type: bool, description: Fill start → T-101 empty after transfer}
      - {name: M101_Agitator,     offset: 17, type: bool}
  P201:
    base: 50
    metrics:
      - {name: AlarmWord,         offset: 3, source: "G_Alarms.{device}_Word"}
      - {name: CommsOk,           offset: 4, type: bool, source: "G_Comms.{device}"}
      - {name: TT201_InTemp,      offset: 10, scale: 10,  unit: "°C", deadband: 0.2}
      - {name: TT202_OutTemp,     offset: 11, scale: 10,  unit: "°C", deadband: 0.1}
      - {name: FT201_Flow,        offset: 12, unit: "L/min", deadband: 5}
      - {name: PT201_SteamPressure, offset: 13, scale: 100, unit: bar, deadband: 0.05}
      - {name: TCV201_SteamValve, offset: 14, scale: 10,  unit: "%", deadband: 1}
      - {name: TempSP,            offset: 15, scale: 10,  unit: "°C"}
      - {name: XV203_Divert,      offset: 16, type: bool, description: Divert valve commanded}
      - {name: DivertCount,       offset: 17, description: Divert events since PLC start}
      - {name: ForwardFlowOk,     offset: 18, type: bool}
  T301:
    base: 100
    metrics:
      - {name: AlarmWord,         offset: 3, source: "G_Alarms.{device}_Word"}
      - {name: CommsOk,           offset: 4, type: bool, source: "G_Comms.{device}"}
      - {name: LT301_Level,       offset: 10, scale: 10, unit: "%", deadband: 0.5}
      - {name: FillerPermissive,  offset: 11, type: bool, description: "LT301 above the F-401 start level"}
  F401:
    base: 150
    header: packaging_header
    metrics:
      - {name: FillTargetG,       offset: 10, scale: 10, unit: g}
  C501:
    base: 200
    header: packaging_header
    metrics:
      - {name: C501_Torque,       offset: 10, scale: 100, unit: Nm, deadband: 0.05}
      - {name: LT502_CapHopper,   offset: 11, scale: 10,  unit: "%", deadband: 1}
  L601:
    base: 250
    header: packaging_header
    metrics:
      - {name: L601_RollRemaining, offset: 10, unit: labels, deadband: 50}
  Q701:
    base: 300
    header: packaging_header
    metrics:
      - {name: RejectLimitG,      offset: 10, scale: 10, unit: g}
      - {name: WT701_LastWeight,  offset: 11, scale: 10, unit: g, deadband: 0.5}
      # offsets 14–49: nozzle n (1–12) at 14 + 3(n−1): Seq, Mean (×10 g), Range (×10 g)
    nozzle_subgroups: {first_offset: 14, count: 12, fields: [Seq, Mean, Range], scale: [1, 10, 10]}
  K801:
    base: 350
    header: packaging_header
    metrics: []
  LINE:
    base: 400
    metrics:
      - {name: State,             offset: 0, enum: PackMLState, description: Line state = F-401 state}
      - {name: ActiveAlarmCount,  offset: 1, source: G_Alarms.ActiveCount}
      - {name: FirstOutAlarmId,   offset: 2, source: G_Alarms.FirstOutId, description: "0 = none"}
      - {name: AlarmWord,         offset: 3, source: "G_Alarms.{device}_Word"}
      - {name: CommsOk,           offset: 4, type: bool, source: "G_Comms.{device}"}
      - {name: CV1_Fill,          offset: 10, unit: bottles, deadband: 2}
      - {name: CV2_Fill,          offset: 11, unit: bottles, deadband: 5}
      - {name: CV3_Fill,          offset: 12, unit: bottles, deadband: 5}
      - {name: CV4_Fill,          offset: 13, unit: bottles, deadband: 5}
      - {name: RecipeId,          offset: 20, description: Active recipe}
      - {name: RecipeVersion,     offset: 21}
      - {name: ProductCode,       offset: 22}
      - {name: PlcHeartbeat,      offset: 49, description: +1 per scan, wraps}

# --- %MW600–%MW799: alarm table, PLC → bridge ----------------------------------------------------
# Word 600 + id: bit0 active, bit1 acknowledged, bit2 first-out, bits 8–11 priority (1 high … 4).
alarm_table:
  base: 600
  alarms:
    - {id: 1,  device: T101, local: 0, priority: 3, name: T101_BrixOutOfSpec, text: Batch Brix out of tolerance}
    - {id: 2,  device: T101, local: 1, priority: 1, name: T101_CommsLost,     text: T-101 remote I/O not responding}
    - {id: 3,  device: P201, local: 0, priority: 1, name: P201_LowTemp,       text: Outlet below 83 °C, product diverted}
    - {id: 4,  device: P201, local: 1, priority: 2, name: P201_SteamLow,      text: Steam pressure low}
    - {id: 5,  device: P201, local: 2, priority: 1, name: P201_CommsLost,     text: P-201 remote I/O not responding}
    - {id: 6,  device: T301, local: 0, priority: 3, name: T301_LowLevel,      text: Buffer below filler start level}
    - {id: 7,  device: T301, local: 1, priority: 1, name: T301_CommsLost,     text: T-301 remote I/O not responding}
    - {id: 8,  device: F401, local: 0, priority: 2, name: F401_NozzleLeak,    text: Filler nozzle leak}
    - {id: 9,  device: F401, local: 1, priority: 1, name: F401_CommsLost,     text: F-401 remote I/O not responding}
    - {id: 10, device: C501, local: 0, priority: 2, name: C501_Jam,           text: Capper jam}
    - {id: 11, device: C501, local: 1, priority: 1, name: C501_Breakdown,     text: Capper breakdown}
    - {id: 12, device: C501, local: 2, priority: 3, name: C501_CapsEmpty,     text: Cap hopper empty}
    - {id: 13, device: C501, local: 3, priority: 1, name: C501_CommsLost,     text: C-501 remote I/O not responding}
    - {id: 14, device: L601, local: 0, priority: 3, name: L601_RollEmpty,     text: Label roll empty}
    - {id: 15, device: L601, local: 1, priority: 2, name: L601_LabelError,    text: Label glue / application error}
    - {id: 16, device: L601, local: 2, priority: 1, name: L601_Breakdown,     text: Labeler breakdown}
    - {id: 17, device: L601, local: 3, priority: 1, name: L601_CommsLost,     text: L-601 remote I/O not responding}
    - {id: 18, device: Q701, local: 0, priority: 1, name: Q701_CommsLost,     text: Q-701 remote I/O not responding}
    - {id: 19, device: K801, local: 0, priority: 2, name: K801_Jam,           text: Case packer jam}
    - {id: 20, device: K801, local: 1, priority: 1, name: K801_Breakdown,     text: Case packer breakdown}
    - {id: 21, device: K801, local: 2, priority: 1, name: K801_CommsLost,     text: K-801 remote I/O not responding}
    - {id: 22, device: LINE, local: 0, priority: 1, name: LINE_CommsLost,     text: Line I/O (clock, conveyors, panel) not responding}

# --- %MW800–%MW899: commands, bridge → PLC (one-shot: PLC executes and writes 0) ---------------
commands:
  - {name: F401_Cmd,        mw: 803, enum: Command}
  - {name: C501_Cmd,        mw: 804, enum: Command}
  - {name: L601_Cmd,        mw: 805, enum: Command}
  - {name: Q701_Cmd,        mw: 806, enum: Command}
  - {name: K801_Cmd,        mw: 807, enum: Command}
  - {name: LINE_Cmd,        mw: 808, enum: Command, description: Same as the local panel buttons}
  - {name: F401_StopReason, mw: 813}
  - {name: C501_StopReason, mw: 814}
  - {name: L601_StopReason, mw: 815}
  - {name: Q701_StopReason, mw: 816}
  - {name: K801_StopReason, mw: 817}
  - {name: AlarmAck,        mw: 820, description: "Alarm id, or 65535 (−1 signed) = acknowledge all"}
  - {name: P201_TempSP,     mw: 821, scale: 10, unit: "°C", range: [70, 90], description: "Engineering setpoint (PID tests); 0 = keep"}

# --- %MW900–%MW999: recipe download + handshake (contracts.md §2) ------------------------------
recipe:
  request:   # bridge writes these, then sets Recipe_Req
    - {name: Recipe_Req,      mw: 900, type: bool}
    - {name: RecipeId,        mw: 903}
    - {name: RecipeVersion,   mw: 904}
    - {name: ProductCode,     mw: 905, range: [1, 2]}
    - {name: BrixTarget,      mw: 906, scale: 100, unit: "°Bx", range: [9.0, 14.0]}
    - {name: BrixTol,         mw: 907, scale: 100, unit: "°Bx", range: [0.1, 1.0]}
    - {name: ConcRatio,       mw: 908, scale: 1000, unit: "L/L", range: [0.100, 0.250], description: Concentrate share of batch volume}
    - {name: FillTargetG,     mw: 909, scale: 10,  unit: g, range: [995.0, 1020.0]}
    - {name: LineSpeed,       mw: 910, unit: bpm, range: [60, 120]}
    - {name: CapTorque,       mw: 911, scale: 100, unit: Nm, range: [1.5, 3.0]}
  response:  # PLC writes these; cleared when Recipe_Req returns to 0
    - {name: Recipe_Ack,      mw: 901, type: bool}
    - {name: Recipe_Nak,      mw: 902, enum: RecipeNak, description: "0 = no Nak"}
  timeout_s: 10

# --- %MD0–%MD99: 32-bit counters, PLC → bridge (sim I/O counter of the same name, else G_Counters)
counters:
  - {name: F401_Count,       md: 0}
  - {name: C501_Count,       md: 1}
  - {name: L601_Count,       md: 2}
  - {name: Q701_Count,       md: 3}
  - {name: Q701_RejectCount, md: 4}
  - {name: Q701_GoodCount,   md: 5, description: Q701_Count − Q701_RejectCount}
  - {name: K801_CaseCount,   md: 6}
  - {name: T101_ConcLotNo,   md: 7, description: Concentrate lot of the batch in T-101}
  - {name: SIM_TimeMs,       md: 8, unit: ms, description: PLC time base (sim clock), for UNS timestamps}
