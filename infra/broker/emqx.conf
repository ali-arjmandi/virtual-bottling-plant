## EMQX for the Line 1 Unified Namespace (docs/prd/l2-edge-uns.md UNS-01..03).
## Read-only config; environment variables (docker-compose.yml) take precedence.

node {
  name = "emqx@127.0.0.1"
  cookie = "${EMQX_NODE_COOKIE}"
  data_dir = "data"
}

cluster {
  name = vbp
  discovery_strategy = manual
}

## MQTT over TLS only (UNS-01). The dev override turns the plain listener on.
listeners.tcp.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/vbp/ca.crt"
    certfile = "/opt/emqx/etc/certs/vbp/broker.crt"
    keyfile = "/opt/emqx/etc/certs/vbp/broker.key"
    verify = verify_none
  }
}

## One user per client (UNS-02), seeded from env by start.sh on first start.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm { name = sha256, salt_position = suffix }
    bootstrap_file = "/opt/emqx/data/bootstrap-users.csv"
    bootstrap_type = plain
  }
]

## ACL generated from contracts/uns/topics.yaml. A denied QoS 1 publish gets PUBACK 0x87.
authorization {
  no_match = deny
  deny_action = ignore
  cache { enable = false }
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }
  ]
}

## Sparkplug messages are small; Q701 DBIRTH is the largest (~400 metrics).
mqtt.max_packet_size = 1MB

dashboard.listeners.http.bind = 18083
