# Physical parameters of Line 1. Behaviour only; all decisions are made by the PLC.
start_time: "2026-10-05T05:30:00+00:00"   # sim t = 0 (a Monday, 30 min before the first shift)
tick_ms: 100

mix_tank:            # T-101
  capacity_l: 5500
  water_flow_lpm: 600
  conc_flow_lpm: 120
  sugar_flow_lpm: 60
  drain_flow_lpm: 500
  agitator_rpm: 120
  mix_tau_s: 180         # time constant to a uniform mix with the agitator on
  stratification_bx: 3.0 # Brix offset seen by AT101 while unmixed
  product_temp_c: 12

pasteurizer:         # P-201
  transfer_flow_lpm: 400
  recirc_flow_lpm: 50
  tau_s: 40
  dead_time_s: 5
  gain_c_per_pct: 1.22   # outlet rise per % steam valve at nominal flow and pressure
  ambient_c: 20
  steam_pressure_bar: 3.0

buffer_tank:         # T-301
  capacity_l: 3000
  suction_low_pct: 3
  drain_flow_lpm: 500

cip:
  duration_s: 2700       # 45 min

filler:              # F-401
  nozzles: 12
  max_speed_bpm: 120
  fill_sd_g: 1.0
  nozzle_offset_sd_g: 0.4
  speed_efficiency: {mean: 0.90, sd: 0.03, update_s: 60}   # bottle infeed irregularity
  drift: {nozzle: 7, rate_g_per_h: -0.05, start_after_h: 4}
  restart_underfill: {bottles: 12, mean_g: -9.0, sd_g: 3.0}   # bowl level dips after a stop

capper:              # C-501
  max_speed_bpm: 130
  torque_mean_nm: 2.2
  torque_sd_nm: 0.05
  hopper_caps: 3000
  hopper_refill_at_pct: 15
  refill_delay: {dist: lognormal, median_s: 90, sigma: 0.8, min_s: 20, max_s: 900}

labeler:             # L-601
  max_speed_bpm: 130

checkweigher:        # Q-701
  max_speed_bpm: 140
  subgroup_size: 5

case_packer:         # K-801
  max_speed_cpm: 22
  bottles_per_case: 6

conveyors:           # capacity in bottles. CV1 is the filler/capper monoblock transfer.
  CV1: 12
  CV2: 150
  CV3: 150
  CV4: 150

status_debounce_s: 2   # blocked/starved shorter than this counts as producing
