# Fault catalog per machine. Trigger clocks run on machine running time (or count for 'count').
# kind: micro | breakdown | material   (stops the machine while active)
#       process                        (changes behaviour, does not stop it)
C501:
  - {type: jam, kind: micro, signal: C501_Jam,
     trigger: {dist: exponential, mean_s: 300},
     duration: {dist: uniform, min_s: 10, max_s: 60}}
  - {type: breakdown, kind: breakdown, signal: C501_Breakdown,
     trigger: {dist: weibull, shape: 1.5, scale_s: 150000},
     duration: {dist: lognormal, median_s: 900, sigma: 0.5, min_s: 300, max_s: 2700}}
F401:
  - {type: nozzle_leak, kind: breakdown, signal: F401_NozzleLeak,
     trigger: {dist: weibull, shape: 1.5, scale_s: 290000},
     duration: {dist: uniform, min_s: 1200, max_s: 2400}}
L601:
  - {type: roll_empty, kind: material, signal: L601_RollEmpty,
     trigger: {dist: count, mean: 4000, sd: 0},
     duration: {dist: uniform, min_s: 90, max_s: 210}}
  - {type: label_error, kind: micro, signal: L601_LabelError,
     trigger: {dist: exponential, mean_s: 1200},
     duration: {dist: uniform, min_s: 15, max_s: 90}}
  - {type: breakdown, kind: breakdown, signal: L601_Breakdown,
     trigger: {dist: weibull, shape: 1.5, scale_s: 200000},
     duration: {dist: lognormal, median_s: 900, sigma: 0.5, min_s: 300, max_s: 2700}}
K801:
  - {type: jam, kind: micro, signal: K801_Jam,
     trigger: {dist: exponential, mean_s: 2400},
     duration: {dist: uniform, min_s: 60, max_s: 300}}
  - {type: breakdown, kind: breakdown, signal: K801_Breakdown,
     trigger: {dist: weibull, shape: 1.5, scale_s: 180000},
     duration: {dist: lognormal, median_s: 900, sigma: 0.5, min_s: 300, max_s: 2700}}
P201:
  - {type: steam_drop, kind: process,
     trigger: {dist: exponential, mean_s: 604800},
     duration: {dist: uniform, min_s: 600, max_s: 1800},
     effect: {steam_factor_min: 0.35, steam_factor_max: 0.55}}
