# Virtual Bottling Plant. One Docker network per Purdue zone (docs/prd/architecture.md §1).
# Phase 2: L0 simulator + L1 soft-PLC. Later phases add edge-bridge, broker, ignition, mes, erp.
name: virtual-bottling-plant

services:
  sim:
    build:
      context: .
      dockerfile: sim/Dockerfile
    environment:
      SIM_SEED: ${SIM_SEED:-42}
      SIM_SPEED: ${SIM_SPEED:-1}
      SIM_CORS_ORIGINS: ${SIM_CORS_ORIGINS:-}
    networks:
      - net-l0-field        # Modbus TCP to the PLC (port 5020)
      - net-l0-instructor   # REST/WS API for the Instructor Station (port 8000)
    restart: unless-stopped

  plc:
    build:
      context: .
      dockerfile: plc/runtime/Dockerfile
    environment:
      PLC_SIM_HOST: sim
      PLC_POLL_MS: ${PLC_POLL_MS:-50}
      PLC_SLAVE_TIMEOUT_MS: ${PLC_SLAVE_TIMEOUT_MS:-250}
    networks:
      - net-l0-field        # Modbus TCP client of the sim (remote I/O)
      - net-l1-control      # Modbus TCP server for the edge bridge (port 502)
    depends_on:
      - sim
    restart: unless-stopped

networks:
  net-l0-field:
    internal: true
  net-l0-instructor:
  net-l1-control:
    internal: true
