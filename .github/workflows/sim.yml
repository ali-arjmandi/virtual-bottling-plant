name: sim

on:
  push:
    paths: ["sim/**", "contracts/**", ".github/workflows/sim.yml"]
  pull_request:
    paths: ["sim/**", "contracts/**", ".github/workflows/sim.yml"]
  workflow_dispatch:
    inputs:
      slow:
        description: Also run the 24 h acceptance runs
        type: boolean
        default: false

defaults:
  run:
    working-directory: sim

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src harness tests
      - run: uv run mypy src harness
      - run: uv run pytest
      - if: ${{ inputs.slow }}
        run: uv run pytest -m slow

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f sim/Dockerfile .
        working-directory: .
